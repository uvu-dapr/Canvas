<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480">
  <defs>
    <radialGradient id="shellGrad" cx="38%" cy="32%" r="62%">
      <stop offset="0%" stop-color="#606060"/>
      <stop offset="100%" stop-color="#1C1C1C"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="480" fill="#111111" rx="12"/>

  <!-- ═══════════════════════════════════════
       TITLE
  ═══════════════════════════════════════ -->
  <text x="450" y="38" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700"
        fill="#F9A825" text-anchor="middle">MIDI 5-Pin DIN  →  XLR 3-Pin Female</text>
  <text x="450" y="58" font-family="Arial, Helvetica, sans-serif" font-size="12"
        fill="#888888" text-anchor="middle">Mating face view (looking into connector)</text>

  <!-- ═══════════════════════════════════════
       MIDI DIN 5-PIN  center (195, 240)
       DIN 41524 mating face:
         Pin 1 — upper-left   (162, 200)
         Pin 3 — upper-right  (228, 200)
         Pin 4 — mid-left     (143, 250)
         Pin 5 — mid-right    (247, 250)
         Pin 2 — bottom-ctr   (195, 288)
  ═══════════════════════════════════════ -->

  <!-- Shell -->
  <circle cx="195" cy="240" r="92" fill="url(#shellGrad)" stroke="#707070" stroke-width="3"/>
  <!-- Key notch at top -->
  <path d="M 178,149 A 92,92 0 0 1 212,149 L 207,162 A 5,5 0 0 0 183,162 Z" fill="#505050"/>
  <!-- Face -->
  <circle cx="195" cy="240" r="76" fill="#0D0D0D" stroke="#3A3A3A" stroke-width="2"/>

  <!-- Pin 1 — NC (upper-left) -->
  <circle cx="162" cy="200" r="14" fill="#202020" stroke="#555555" stroke-width="2"/>
  <text x="162" y="205" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700"
        fill="#AAAAAA" text-anchor="middle">1</text>

  <!-- Pin 3 — NC (upper-right) -->
  <circle cx="228" cy="200" r="14" fill="#202020" stroke="#555555" stroke-width="2"/>
  <text x="228" y="205" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700"
        fill="#AAAAAA" text-anchor="middle">3</text>

  <!-- Pin 4 — Sink / Hot+ (mid-left) — GREEN -->
  <circle cx="143" cy="250" r="15" fill="#053005" stroke="#4CAF50" stroke-width="2.5"/>
  <text x="143" y="255" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700"
        fill="#FFFFFF" text-anchor="middle">4</text>

  <!-- Pin 5 — Source / Cold- (mid-right) — RED -->
  <circle cx="247" cy="250" r="15" fill="#3B0000" stroke="#EF5350" stroke-width="2.5"/>
  <text x="247" y="255" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700"
        fill="#FFFFFF" text-anchor="middle">5</text>

  <!-- Pin 2 — Shield / GND (bottom-center) — BLUE -->
  <circle cx="195" cy="293" r="15" fill="#021030" stroke="#42A5F5" stroke-width="2.5"/>
  <text x="195" y="298" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700"
        fill="#FFFFFF" text-anchor="middle">2</text>

  <!-- NC dashed lines for pins 1 and 3 -->
  <line x1="162" y1="186" x2="162" y2="165" stroke="#444" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="228" y1="186" x2="228" y2="165" stroke="#444" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="162" y="158" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#555555" text-anchor="middle">NC</text>
  <text x="228" y="158" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#555555" text-anchor="middle">NC</text>

  <!-- MIDI label -->
  <text x="195" y="364" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700"
        fill="#F9A825" text-anchor="middle">MIDI 5-Pin DIN</text>
  <text x="195" y="382" font-family="Arial, Helvetica, sans-serif" font-size="11"
        fill="#777777" text-anchor="middle">Male plug</text>

  <!-- ═══════════════════════════════════════
       XLR 3-PIN FEMALE  center (705, 240)
       IEC 60268-12 mating face view:
         Pin 1 — top-left     (672, 195)
         Pin 3 — top-right    (738, 195)
         Pin 2 — bottom-ctr   (705, 285)
  ═══════════════════════════════════════ -->

  <!-- Shell -->
  <circle cx="705" cy="240" r="92" fill="url(#shellGrad)" stroke="#707070" stroke-width="3"/>
  <!-- Key notch at top -->
  <path d="M 688,149 A 92,92 0 0 1 722,149 L 717,162 A 5,5 0 0 0 693,162 Z" fill="#505050"/>
  <!-- Face -->
  <circle cx="705" cy="240" r="76" fill="#0D0D0D" stroke="#3A3A3A" stroke-width="2"/>

  <!-- Pin 1 — Shield / GND (top-left) — BLUE -->
  <circle cx="672" cy="195" r="15" fill="#021030" stroke="#42A5F5" stroke-width="2.5"/>
  <text x="672" y="200" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700"
        fill="#FFFFFF" text-anchor="middle">1</text>

  <!-- Pin 2 — Hot + (top-right) — GREEN -->
  <circle cx="738" cy="195" r="15" fill="#053005" stroke="#4CAF50" stroke-width="2.5"/>
  <text x="738" y="200" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700"
        fill="#FFFFFF" text-anchor="middle">2</text>

  <!-- Pin 3 — Cold - (bottom-center) — RED -->
  <circle cx="705" cy="285" r="15" fill="#3B0000" stroke="#EF5350" stroke-width="2.5"/>
  <text x="705" y="290" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700"
        fill="#FFFFFF" text-anchor="middle">3</text>

  <!-- XLR label -->
  <text x="705" y="364" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700"
        fill="#F9A825" text-anchor="middle">XLR 3-Pin Female</text>
  <text x="705" y="382" font-family="Arial, Helvetica, sans-serif" font-size="11"
        fill="#777777" text-anchor="middle">Female receptacle</text>

  <!-- ═══════════════════════════════════════
       WIRE ROUTING
       Three clearly separated horizontal lanes:
         Lane A (top)    y = 108  — RED    Pin4 → Pin3
         Lane B (middle) y = 134  — GREEN  Pin5 → Pin2
         Lane C (bottom) y = 160  — BLUE   Pin2 → Pin1

       Each wire exits the connector shell sideways/down,
       travels along its lane, then enters the XLR.
  ═══════════════════════════════════════ -->

  <!-- ── GREEN: MIDI Pin 4 (143,250) → Lane A (y=108) → XLR Pin 2 (738,195) ── -->
  <path d="M 143,235 L 143,108 L 738,108 L 738,180"
        stroke="#4CAF50" stroke-width="2.5" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ── RED: MIDI Pin 5 (247,250) → Lane B (y=134) → XLR Pin 3 (705,285) ── -->
  <path d="M 247,235 L 247,134 L 705,134 L 705,270"
        stroke="#EF5350" stroke-width="2.5" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ── BLUE: MIDI Pin 2 (195,293) → Lane C (y=160) → XLR Pin 1 (672,195) ── -->
  <path d="M 195,308 L 195,400 L 450,400 L 450,160 L 672,160 L 672,180"
        stroke="#42A5F5" stroke-width="2.5" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ═══════════════════════════════════════
       WIRE LABELS  — placed on horizontal runs, above the wire
  ═══════════════════════════════════════ -->

  <!-- Background pills for legibility -->
  <rect x="280" y="94" width="290" height="18" rx="4" fill="#111111"/>
  <rect x="280" y="120" width="290" height="18" rx="4" fill="#111111"/>
  <rect x="280" y="390" width="290" height="18" rx="4" fill="#111111"/>

  <text x="425" y="107" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700"
        fill="#4CAF50" text-anchor="middle">MIDI Pin 4 (Sink / Hot)  →  XLR Pin 2 (Hot +)</text>
  <text x="425" y="133" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700"
        fill="#EF5350" text-anchor="middle">MIDI Pin 5 (Source / Cold)  →  XLR Pin 3 (Cold −)</text>
  <text x="425" y="403" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700"
        fill="#42A5F5" text-anchor="middle">Pin 2 (Shield / GND)  →  XLR Pin 1 (Shield / GND)</text>

  <!-- ═══════════════════════════════════════
       PIN LEGEND  — bottom center
  ═══════════════════════════════════════ -->
  <rect x="270" y="425" width="360" height="46" rx="6" fill="#1A1A1A" stroke="#333333" stroke-width="1"/>

  <!-- Green swatch -->
  <rect x="286" y="437" width="12" height="12" rx="2" fill="#4CAF50"/>
  <text x="304" y="448" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#CCCCCC">MIDI 4  →  XLR 2 (Hot +)</text>

  <!-- Red swatch -->
  <rect x="286" y="455" width="12" height="12" rx="2" fill="#EF5350"/>
  <text x="304" y="466" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#CCCCCC">MIDI 5  →  XLR 3 (Cold −)</text>

  <!-- Blue swatch -->
  <rect x="470" y="437" width="12" height="12" rx="2" fill="#42A5F5"/>
  <text x="488" y="448" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#CCCCCC">MIDI 2  →  XLR 1 (Shield)</text>

  <!-- NC note -->
  <text x="488" y="466" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#555555">MIDI 1 &amp; 3  =  No Connect</text>

</svg>
