<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Deadline or due date">
  <!-- Circle background -->
  <circle cx="24" cy="24" r="21" fill="#FFF8E1" stroke="#993300" stroke-width="1.2"/>
  <!-- Clock face: r=14, centered at 24,24 -->
  <circle cx="24" cy="24" r="14" fill="none" stroke="#993300" stroke-width="1.8"/>
  <!-- 12 o'clock tick -->
  <line x1="24" y1="11" x2="24" y2="13.5" stroke="#993300" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Minute hand pointing to 12 -->
  <line x1="24" y1="24" x2="24" y2="14" stroke="#993300" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Hour hand pointing to roughly 4 -->
  <line x1="24" y1="24" x2="31" y2="29" stroke="#993300" stroke-width="1.8" stroke-linecap="round"/>
</svg>
