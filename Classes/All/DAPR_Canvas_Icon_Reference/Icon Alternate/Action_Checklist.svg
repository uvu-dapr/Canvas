<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Pre-submission checklist">
  <circle cx="24" cy="24" r="21" fill="#E8F5E9" stroke="#1B5E20" stroke-width="1.2"/>
  <!-- Clipboard body -->
  <rect x="14" y="16" width="20" height="20" rx="2" fill="none" stroke="#1B5E20" stroke-width="1.8"/>
  <!-- Clip notch at top -->
  <rect x="19" y="14" width="10" height="5" rx="1.5" fill="none" stroke="#1B5E20" stroke-width="1.6"/>
  <!-- Checkmark row -->
  <polyline points="18,25 21,28 25,22" fill="none" stroke="#1B5E20" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="27" y1="25" x2="31" y2="25" stroke="#1B5E20" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Second line -->
  <line x1="18" y1="31" x2="31" y2="31" stroke="#1B5E20" stroke-width="1.6" stroke-linecap="round"/>
</svg>
