<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" width="100%" role="img" aria-label="Logarithmic bar chart of sound speed in rubber, air, helium, water, wood, copper, steel and diamond" style="max-width:100%;height:auto;font-family:Arial,Helvetica,sans-serif;" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect x="0" y="0" width="940" height="560" fill="#FFFFFF"/>
<text x="140" y="42" font-size="24" font-weight="bold" fill="#212121">Speed of Sound Across Media</text>
<text x="140" y="68" font-size="15" fill="#616161">Logarithmic scale. Each gridline is ten times the previous.</text>
<line x1="283.0" y1="86" x2="283.0" y2="482" stroke="#CCCCCC" stroke-width="1"/>
<text x="283.0" y="502" font-size="13" fill="#616161" text-anchor="middle">100 m/s</text>
<text x="283.0" y="520" font-size="13" fill="#616161" text-anchor="middle">328 ft/s</text>
<line x1="487.7" y1="86" x2="487.7" y2="482" stroke="#CCCCCC" stroke-width="1"/>
<text x="487.7" y="502" font-size="13" fill="#616161" text-anchor="middle">1,000 m/s</text>
<text x="487.7" y="520" font-size="13" fill="#616161" text-anchor="middle">3,281 ft/s</text>
<line x1="692.4" y1="86" x2="692.4" y2="482" stroke="#CCCCCC" stroke-width="1"/>
<text x="692.4" y="502" font-size="13" fill="#616161" text-anchor="middle">10,000 m/s</text>
<text x="692.4" y="520" font-size="13" fill="#616161" text-anchor="middle">32,808 ft/s</text>
<line x1="140" y1="86" x2="140" y2="482" stroke="#212121" stroke-width="2"/>
<rect x="140" y="105.9" width="97.6" height="27.4" fill="#616161" rx="3"/>
<text x="126" y="124.6" font-size="16" font-weight="normal" fill="#212121" text-anchor="end">Rubber</text>
<text x="249.6" y="118.6" font-size="14" font-weight="bold" fill="#212121">197 ft/s</text>
<text x="249.6" y="134.6" font-size="13" fill="#616161">60 m/s</text>
<rect x="140" y="153.2" width="253.0" height="27.4" fill="#0D47A1" rx="3"/>
<text x="126" y="171.9" font-size="16" font-weight="bold" fill="#212121" text-anchor="end">Air</text>
<text x="405.0" y="165.9" font-size="14" font-weight="bold" fill="#212121">1,130 ft/s</text>
<text x="405.0" y="181.9" font-size="13" fill="#616161">344 m/s</text>
<rect x="140" y="200.4" width="348.4" height="27.4" fill="#4A148C" rx="3"/>
<text x="126" y="219.1" font-size="16" font-weight="normal" fill="#212121" text-anchor="end">Helium</text>
<text x="500.4" y="213.1" font-size="14" font-weight="bold" fill="#212121">3,307 ft/s</text>
<text x="500.4" y="229.1" font-size="13" fill="#616161">1,008 m/s</text>
<rect x="140" y="247.7" width="382.7" height="27.4" fill="#00838F" rx="3"/>
<text x="126" y="266.4" font-size="16" font-weight="bold" fill="#212121" text-anchor="end">Water</text>
<text x="534.7" y="260.4" font-size="14" font-weight="bold" fill="#212121">4,862 ft/s</text>
<text x="534.7" y="276.4" font-size="13" fill="#616161">1,482 m/s</text>
<rect x="140" y="294.9" width="464.0" height="27.4" fill="#5D4037" rx="3"/>
<text x="126" y="313.6" font-size="16" font-weight="normal" fill="#212121" text-anchor="end">Wood</text>
<text x="616.0" y="307.6" font-size="14" font-weight="bold" fill="#212121">12,139 ft/s</text>
<text x="616.0" y="323.6" font-size="13" fill="#616161">3,700 m/s</text>
<rect x="140" y="342.2" width="486.4" height="27.4" fill="#993300" rx="3"/>
<text x="126" y="360.9" font-size="16" font-weight="normal" fill="#212121" text-anchor="end">Copper</text>
<text x="638.4" y="354.9" font-size="14" font-weight="bold" fill="#212121">15,617 ft/s</text>
<text x="638.4" y="370.9" font-size="13" fill="#616161">4,760 m/s</text>
<rect x="140" y="389.4" width="506.4" height="27.4" fill="#B71C1C" rx="3"/>
<text x="126" y="408.1" font-size="16" font-weight="bold" fill="#212121" text-anchor="end">Steel</text>
<text x="658.4" y="402.1" font-size="14" font-weight="bold" fill="#212121">19,554 ft/s</text>
<text x="658.4" y="418.1" font-size="13" fill="#616161">5,960 m/s</text>
<rect x="140" y="436.7" width="604.6" height="27.4" fill="#1B5E20" rx="3"/>
<text x="126" y="455.4" font-size="16" font-weight="normal" fill="#212121" text-anchor="end">Diamond</text>
<text x="756.6" y="449.4" font-size="14" font-weight="bold" fill="#212121">59,055 ft/s</text>
<text x="756.6" y="465.4" font-size="13" fill="#616161">18,000 m/s</text>
<text x="140" y="542" font-size="14" fill="#212121">Air, water and steel are shown in bold: the three media most audio work passes through.</text>
</svg>