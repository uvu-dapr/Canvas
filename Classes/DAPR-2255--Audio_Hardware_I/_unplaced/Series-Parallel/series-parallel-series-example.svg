<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520">
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="520" fill="#f8f9ff" rx="12"/>

  <!-- Title -->
  <text x="400" y="50" text-anchor="middle" font-size="30" font-weight="bold" fill="#1a2a5e">Series Resistor Example</text>
  <text x="400" y="78" text-anchor="middle" font-size="16" fill="#444">9 V source with three resistors in series</text>

  <!-- Left panel: Circuit Diagram -->
  <rect x="20" y="95" width="370" height="310" fill="#e8f4ff" rx="8" stroke="#90c0e8" stroke-width="1.5"/>
  <text x="205" y="122" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a2a5e">Circuit Diagram</text>

  <!-- Circuit wires -->
  <!-- Top wire -->
  <line x1="90" y1="160" x2="310" y2="160" stroke="#222" stroke-width="3"/>
  <!-- Bottom wire -->
  <line x1="90" y1="370" x2="310" y2="370" stroke="#222" stroke-width="3"/>
  <!-- Left wire -->
  <line x1="90" y1="160" x2="90" y2="370" stroke="#222" stroke-width="3"/>
  <!-- Right wire top to R1 -->
  <line x1="310" y1="160" x2="310" y2="195" stroke="#222" stroke-width="3"/>
  <!-- Right wire R1 to R2 -->
  <line x1="310" y1="235" x2="310" y2="265" stroke="#222" stroke-width="3"/>
  <!-- Right wire R2 to R3 -->
  <line x1="310" y1="305" x2="310" y2="335" stroke="#222" stroke-width="3"/>
  <!-- Right wire R3 to bottom -->
  <line x1="310" y1="375" x2="310" y2="370" stroke="#222" stroke-width="3"/>

  <!-- Battery symbol -->
  <line x1="90" y1="240" x2="90" y2="240" stroke="#222" stroke-width="2"/>
  <line x1="72" y1="248" x2="108" y2="248" stroke="#cc0000" stroke-width="4"/>
  <line x1="80" y1="262" x2="100" y2="262" stroke="#cc0000" stroke-width="2.5"/>
  <line x1="72" y1="276" x2="108" y2="276" stroke="#cc0000" stroke-width="4"/>
  <line x1="80" y1="290" x2="100" y2="290" stroke="#cc0000" stroke-width="2.5"/>
  <text x="60" y="245" text-anchor="middle" font-size="15" fill="#cc0000" font-weight="bold">+</text>
  <text x="60" y="295" text-anchor="middle" font-size="15" fill="#cc0000" font-weight="bold">−</text>
  <text x="45" y="270" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">9 V</text>

  <!-- R1 zigzag (blue) at y=195-235 -->
  <polyline points="310,195 296,202 324,210 296,218 324,226 310,233" fill="none" stroke="#2266cc" stroke-width="3" stroke-linejoin="round"/>
  <text x="340" y="218" font-size="14" font-weight="bold" fill="#2266cc">R₁ = 1 kΩ</text>

  <!-- R2 zigzag (orange) at y=265-305 -->
  <polyline points="310,265 296,272 324,280 296,288 324,296 310,303" fill="none" stroke="#e07000" stroke-width="3" stroke-linejoin="round"/>
  <text x="340" y="288" font-size="14" font-weight="bold" fill="#e07000">R₂ = 2 kΩ</text>

  <!-- R3 zigzag (purple) at y=335-375 -->
  <polyline points="310,335 296,342 324,350 296,358 324,366 310,373" fill="none" stroke="#7722aa" stroke-width="3" stroke-linejoin="round"/>
  <text x="340" y="358" font-size="14" font-weight="bold" fill="#7722aa">R₃ = 3 kΩ</text>

  <!-- Current arrow -->
  <line x1="150" y1="153" x2="230" y2="153" stroke="#007700" stroke-width="2.5" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#007700"/>
    </marker>
  </defs>
  <text x="190" y="148" text-anchor="middle" font-size="13" font-style="italic" font-weight="bold" fill="#007700">I = 1.5 mA</text>

  <!-- Right panel: Calculations -->
  <rect x="410" y="95" width="370" height="310" fill="#efffee" rx="8" stroke="#90d890" stroke-width="1.5"/>
  <text x="595" y="122" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a2a5e">Calculations</text>

  <!-- Calc lines -->
  <text x="430" y="152" font-size="14" fill="#222">R<tspan font-size="10" dy="3">total</tspan><tspan dy="-3"> = 1k + 2k + 3k = </tspan><tspan font-weight="bold">6 kΩ</tspan></text>

  <!-- I = 9V / 6000 ohm fraction -->
  <text x="430" y="182" font-size="14" fill="#222">I  =</text>
  <text x="468" y="174" font-size="13" fill="#222" text-anchor="middle">9 V</text>
  <line x1="455" y1="177" x2="495" y2="177" stroke="#222" stroke-width="1.5"/>
  <text x="475" y="192" font-size="12" fill="#222">6,000 Ω</text>
  <text x="502" y="182" font-size="14" fill="#222">= <tspan font-weight="bold">1.5 mA</tspan></text>

  <text x="430" y="220" font-size="14" fill="#222">V<tspan font-size="10" dy="3">R1</tspan><tspan dy="-3"> = 0.0015 × 1000 = </tspan><tspan font-weight="bold" fill="#2266cc">1.5 V</tspan></text>
  <text x="430" y="248" font-size="14" fill="#222">V<tspan font-size="10" dy="3">R2</tspan><tspan dy="-3"> = 0.0015 × 2000 = </tspan><tspan font-weight="bold" fill="#e07000">3.0 V</tspan></text>
  <text x="430" y="276" font-size="14" fill="#222">V<tspan font-size="10" dy="3">R3</tspan><tspan dy="-3"> = 0.0015 × 3000 = </tspan><tspan font-weight="bold" fill="#7722aa">4.5 V</tspan></text>

  <!-- KVL check box -->
  <rect x="425" y="292" width="340" height="100" fill="#fff8e1" rx="6" stroke="#f0b800" stroke-width="2"/>
  <text x="595" y="322" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a2a5e">Check: 1.5 + 3.0 + 4.5 = 9.0 V</text>
  <text x="595" y="348" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a2a5e">KVL confirmed ✓</text>

  <!-- Bottom bar -->
  <rect x="20" y="418" width="760" height="82" fill="#dde8f8" rx="8" stroke="#90c0e8" stroke-width="1"/>

  <!-- Icon 1: book -->
  <circle cx="90" cy="459" r="22" fill="#1a3a7e"/>
  <text x="90" y="465" text-anchor="middle" font-size="18" fill="white">📖</text>
  <text x="130" y="455" font-size="13" font-weight="bold" fill="#1a2a5e">Series circuit</text>

  <!-- Divider -->
  <line x1="290" y1="428" x2="290" y2="490" stroke="#90c0e8" stroke-width="1"/>

  <!-- Icon 2: arrow -->
  <circle cx="360" cy="459" r="22" fill="#2a9a2a"/>
  <text x="360" y="465" text-anchor="middle" font-size="18" fill="white">→</text>
  <text x="395" y="448" font-size="13" font-weight="bold" fill="#1a2a5e">Same current</text>
  <text x="395" y="466" font-size="13" fill="#1a2a5e">through all resistors</text>

  <!-- Divider -->
  <line x1="560" y1="428" x2="560" y2="490" stroke="#90c0e8" stroke-width="1"/>

  <!-- Icon 3: sigma -->
  <circle cx="620" cy="459" r="22" fill="#7722aa"/>
  <text x="620" y="466" text-anchor="middle" font-size="20" font-weight="bold" fill="white">Σ</text>
  <text x="655" y="448" font-size="13" font-weight="bold" fill="#1a2a5e">Voltage drops add to</text>
  <text x="655" y="466" font-size="13" fill="#1a2a5e">the source voltage</text>
</svg>
