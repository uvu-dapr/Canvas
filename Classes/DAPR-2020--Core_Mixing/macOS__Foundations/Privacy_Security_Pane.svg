<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect width="640" height="400" fill="#ffffff" stroke="#424242" stroke-width="2" rx="8"/>
  <rect x="0" y="0" width="640" height="44" fill="#f5f5f5" rx="8"/>
  <text x="24" y="28" fill="#212121" font-size="16" font-weight="bold">Privacy &amp; Security (illustrative)</text>

  <g font-size="14" fill="#212121">
    <rect x="24" y="60" width="592" height="40" fill="#e3f2fd" stroke="#0d47a1"/>
    <text x="36" y="85">Microphone</text>
    <rect x="540" y="68" width="60" height="24" rx="12" fill="#1b5e20"/>
    <text x="570" y="85" text-anchor="middle" fill="#ffffff" font-size="11">Allowed</text>

    <rect x="24" y="100" width="592" height="40" fill="#ffffff" stroke="#e0e0e0"/>
    <text x="36" y="125">Camera</text>
    <rect x="540" y="108" width="60" height="24" rx="12" fill="#1b5e20"/>
    <text x="570" y="125" text-anchor="middle" fill="#ffffff" font-size="11">Allowed</text>

    <rect x="24" y="140" width="592" height="40" fill="#e3f2fd" stroke="#0d47a1"/>
    <text x="36" y="165">Accessibility</text>
    <rect x="540" y="148" width="60" height="24" rx="12" fill="#616161"/>
    <text x="570" y="165" text-anchor="middle" fill="#ffffff" font-size="11">Denied</text>

    <rect x="24" y="180" width="592" height="40" fill="#ffffff" stroke="#e0e0e0"/>
    <text x="36" y="205">Full Disk Access</text>
    <rect x="540" y="188" width="60" height="24" rx="12" fill="#616161"/>
    <text x="570" y="205" text-anchor="middle" fill="#ffffff" font-size="11">Denied</text>
  </g>

  <text x="24" y="250" fill="#5d4037" font-size="14" font-weight="bold">Security</text>
  <rect x="24" y="264" width="592" height="70" rx="6" fill="#fff8e1" stroke="#f57f17" stroke-width="2"/>
  <text x="40" y="288" fill="#212121" font-size="13">System software from "AudioInterfaceCo" was blocked</text>
  <text x="40" y="306" fill="#212121" font-size="13">from loading.</text>
  <rect x="480" y="290" width="110" height="32" rx="6" fill="#1b5e20"/>
  <text x="535" y="311" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">Allow</text>
</svg>
