  <text x="470" y="248" text-anchor="middle" fill="#212121" font-size="14">/Users/yourname</text>

  <line x1="470" y1="266" x2="470" y2="290" stroke="#616161" stroke-width="2" stroke-dasharray="4,3"/>
  <rect x="380" y="290" width="180" height="26" rx="4" fill="#e3f2fd" stroke="#0d47a1" stroke-width="2"/>
  <text x="470" y="308" text-anchor="middle" fill="#212121" font-size="12">~/Library (hidden)</text>
