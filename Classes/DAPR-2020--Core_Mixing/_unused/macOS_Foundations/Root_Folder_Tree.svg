  <text x="380" y="48" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="bold">Root of Drive</text>

  <line x1="380" y1="66" x2="90" y2="120" stroke="#616161" stroke-width="2"/>
  <line x1="380" y1="66" x2="290" y2="120" stroke="#616161" stroke-width="2"/>
  <line x1="380" y1="66" x2="470" y2="120" stroke="#616161" stroke-width="2"/>
