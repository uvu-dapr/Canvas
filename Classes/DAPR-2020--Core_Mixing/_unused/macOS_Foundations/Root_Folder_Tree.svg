  <rect x="20" y="120" width="140" height="46" rx="6" fill="#e3f2fd" stroke="#0d47a1" stroke-width="2"/>
  <text x="90" y="148" text-anchor="middle" fill="#212121" font-size="15" font-weight="bold">Library</text>

  <rect x="220" y="120" width="140" height="46" rx="6" fill="#fbe9e7" stroke="#c62828" stroke-width="2"/>
