<svg viewBox="0 0 800 220" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect width="800" height="220" fill="#ffffff"/>
  <line x1="40" y1="110" x2="760" y2="110" stroke="#616161" stroke-width="2"/>

  <circle cx="90" cy="110" r="6" fill="#4a148c"/>
  <text x="90" y="90" text-anchor="middle" fill="#212121" font-size="13" font-weight="bold">FAT16</text>
  <text x="90" y="135" text-anchor="middle" fill="#616161" font-size="11">1980s</text>
  <text x="90" y="150" text-anchor="middle" fill="#616161" font-size="10">2GB volume cap</text>

  <circle cx="240" cy="110" r="6" fill="#4a148c"/>
  <text x="240" y="90" text-anchor="middle" fill="#212121" font-size="13" font-weight="bold">FAT32</text>
  <text x="240" y="135" text-anchor="middle" fill="#616161" font-size="11">1996</text>
  <text x="240" y="150" text-anchor="middle" fill="#616161" font-size="10">4GB file cap</text>

  <circle cx="390" cy="110" r="6" fill="#5d4037"/>
  <text x="390" y="90" text-anchor="middle" fill="#212121" font-size="13" font-weight="bold">HFS+</text>
  <text x="390" y="135" text-anchor="middle" fill="#616161" font-size="11">1998 (Mac)</text>

  <circle cx="540" cy="110" r="6" fill="#0d47a1"/>
  <text x="540" y="90" text-anchor="middle" fill="#212121" font-size="13" font-weight="bold">NTFS</text>
  <text x="540" y="135" text-anchor="middle" fill="#616161" font-size="11">2000 (Windows)</text>

  <circle cx="640" cy="110" r="6" fill="#00838f"/>
  <text x="640" y="90" text-anchor="middle" fill="#212121" font-size="13" font-weight="bold">exFAT</text>
  <text x="640" y="135" text-anchor="middle" fill="#616161" font-size="11">2006</text>
  <text x="640" y="150" text-anchor="middle" fill="#616161" font-size="10">cross-platform</text>

  <circle cx="730" cy="110" r="6" fill="#1b5e20"/>
  <text x="730" y="90" text-anchor="middle" fill="#212121" font-size="13" font-weight="bold">APFS</text>
  <text x="730" y="135" text-anchor="middle" fill="#616161" font-size="11">2017 (Mac)</text>
  <text x="730" y="150" text-anchor="middle" fill="#616161" font-size="10">SSD-optimized</text>
</svg>
