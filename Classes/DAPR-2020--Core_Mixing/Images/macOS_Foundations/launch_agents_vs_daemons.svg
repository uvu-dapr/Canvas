<svg viewBox="0 0 760 340" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect width="760" height="340" fill="#ffffff"/>

  <rect x="30" y="20" width="330" height="46" rx="6" fill="#0d47a1"/>
  <text x="195" y="48" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="bold">Launch Agent</text>

  <rect x="400" y="20" width="330" height="46" rx="6" fill="#5d4037"/>
  <text x="565" y="48" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="bold">Launch Daemon</text>

  <rect x="30" y="86" width="330" height="46" rx="6" fill="#e3f2fd" stroke="#0d47a1" stroke-width="2"/>
  <text x="195" y="114" text-anchor="middle" fill="#212121" font-size="14">Runs as the logged-in user</text>

  <rect x="400" y="86" width="330" height="46" rx="6" fill="#efebe9" stroke="#5d4037" stroke-width="2"/>
  <text x="565" y="114" text-anchor="middle" fill="#212121" font-size="14">Runs as root</text>

  <rect x="30" y="150" width="330" height="46" rx="6" fill="#e3f2fd" stroke="#0d47a1" stroke-width="2"/>
  <text x="195" y="178" text-anchor="middle" fill="#212121" font-size="14">Can show a window or UI</text>

  <rect x="400" y="150" width="330" height="46" rx="6" fill="#efebe9" stroke="#5d4037" stroke-width="2"/>
  <text x="565" y="178" text-anchor="middle" fill="#212121" font-size="14">No UI - runs silently</text>

  <rect x="30" y="214" width="330" height="46" rx="6" fill="#e3f2fd" stroke="#0d47a1" stroke-width="2"/>
  <text x="195" y="242" text-anchor="middle" fill="#212121" font-size="14">Starts after login</text>

  <rect x="400" y="214" width="330" height="46" rx="6" fill="#efebe9" stroke="#5d4037" stroke-width="2"/>
  <text x="565" y="242" text-anchor="middle" fill="#212121" font-size="14">Starts at boot, before login</text>

  <rect x="30" y="278" width="330" height="46" rx="6" fill="#e3f2fd" stroke="#0d47a1" stroke-width="2"/>
  <text x="195" y="300" text-anchor="middle" fill="#212121" font-size="12.5">~/Library/LaunchAgents</text>
  <text x="195" y="316" text-anchor="middle" fill="#212121" font-size="12.5">/Library/LaunchAgents</text>

  <rect x="400" y="278" width="330" height="46" rx="6" fill="#efebe9" stroke="#5d4037" stroke-width="2"/>
  <text x="565" y="306" text-anchor="middle" fill="#212121" font-size="12.5">/Library/LaunchDaemons</text>
</svg>
