<svg viewBox="0 0 500 340" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect width="500" height="340" fill="#ffffff"/>

  <rect x="100" y="40" width="300" height="80" rx="8" fill="#e3f2fd" stroke="#0d47a1" stroke-width="2"/>
  <text x="250" y="72" text-anchor="middle" fill="#212121" font-size="16" font-weight="bold">Software</text>
  <text x="250" y="92" text-anchor="middle" fill="#616161" font-size="11">macOS, Pro Tools, plug-ins</text>
  <text x="250" y="106" text-anchor="middle" fill="#616161" font-size="11">installed, updated, uninstalled</text>

  <rect x="100" y="130" width="300" height="70" rx="8" fill="#fff8e1" stroke="#f57f17" stroke-width="2"/>
  <text x="250" y="160" text-anchor="middle" fill="#212121" font-size="16" font-weight="bold">Firmware</text>
  <text x="250" y="180" text-anchor="middle" fill="#616161" font-size="11">built into a specific chip, controls boot/behavior</text>

  <rect x="100" y="210" width="300" height="80" rx="8" fill="#efebe9" stroke="#5d4037" stroke-width="2"/>
  <text x="250" y="245" text-anchor="middle" fill="#212121" font-size="16" font-weight="bold">Hardware</text>
  <text x="250" y="265" text-anchor="middle" fill="#616161" font-size="11">CPU, RAM, storage, ports - physical</text>

  <line x1="60" y1="80" x2="60" y2="250" stroke="#424242" stroke-width="2" marker-end="url(#a3)"/>
  <text x="35" y="170" fill="#212121" font-size="12" transform="rotate(-90 35 170)">runs on top of</text>

  <defs>
    <marker id="a3" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#424242"/>
    </marker>
  </defs>
</svg>
